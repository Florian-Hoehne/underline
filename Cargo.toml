[workspace]
resolver = "2"
members = [
    "apps/underline-tauri/src-tauri",
    "crates/underline-core",
    "crates/underline-editor-core",
    "crates/underline-editor-view",
    "crates/underline-editor-wasm",
    "crates/underline-facade",
    "crates/underline-markup",
    "crates/underline-mcp",
    "crates/underline-session",
    "crates/underline-wiki",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Florian-Hoehne/underline"
rust-version = "1.95"

[workspace.dependencies]
underline-core = { path = "crates/underline-core" }
underline-mcp = { path = "crates/underline-mcp" }
underline-wiki = { path = "crates/underline-wiki" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
serde_norway = "0.9"
comrak = { version = "0.49", default-features = false }
dejavu = "2.37"
directories = "6"
notify = "8"
open = "5"
notify-debouncer-full = "0.6"
ropey = "1.6"
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
underline-editor-core = { path = "crates/underline-editor-core" }
underline-editor-view = { path = "crates/underline-editor-view" }
underline-facade = { path = "crates/underline-facade" }
underline-markup = { path = "crates/underline-markup" }
underline-session = { path = "crates/underline-session" }
# Specta v2 is a release candidate: pinned exactly, as tauri-specta asks.
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
# ADR-025: pinned exactly; the CLI in `.tools/` must be the same version
# (`apps/underline-tauri/ui/scripts/wasm.js` checks it).
wasm-bindgen = "=0.2.130"
