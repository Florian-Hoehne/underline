[workspace]
resolver = "2"
members = [
    "apps/underline-desktop",
    "crates/underline-core",
    "crates/underline-editor",
    "crates/underline-facade",
    "crates/underline-mcp",
    "crates/underline-wiki",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Florian-Hoehne/underline"
rust-version = "1.95"

[workspace.dependencies]
underline-core = { path = "crates/underline-core" }
underline-mcp = { path = "crates/underline-mcp" }
underline-wiki = { path = "crates/underline-wiki" }
eframe = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
serde_norway = "0.9"
comrak = { version = "0.49", default-features = false }
dejavu = "2.37"
directories = "6"
notify = "8"
open = "5"
notify-debouncer-full = "0.6"
ropey = "1.6"
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
underline-editor = { path = "crates/underline-editor" }
underline-facade = { path = "crates/underline-facade" }
