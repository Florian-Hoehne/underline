[package]
name = "underline-session"
description = "Underline's workspace session without a UI: tabs, saving, background services and the tick"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Derives `specta::Type` on the DTOs so the Tauri app can generate TypeScript
# bindings; core and facade stay free of code generation.
specta = ["dep:specta", "underline-editor-view/specta"]

[dependencies]
underline-core.workspace = true
underline-facade.workspace = true
underline-editor-core.workspace = true
underline-editor-view.workspace = true
underline-wiki.workspace = true
# UC-016, ADR-017: MCP install for the section "Agents" of the settings.
underline-mcp.workspace = true
ropey.workspace = true
serde.workspace = true
thiserror.workspace = true
specta = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
