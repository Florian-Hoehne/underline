[package]
name = "underline-facade"
description = "Facade engine of Underline: one format module per note format"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
underline-core.workspace = true
underline-markup.workspace = true
syntect.workspace = true
comrak.workspace = true
thiserror.workspace = true
dejavu.workspace = true
ab_glyph = "0.2"
rquickjs = "=0.8.1"
resvg = { version = "=0.45.1", default-features = false, features = ["text"] }
# Mermaid (ADR-009): every diagram family, SVG without the ELK layout.
merman = { version = "=0.9.3", default-features = false, features = ["all-diagrams", "complete-svg"] }
serde_json.workspace = true
# FR-098, ADR-029: formulas typeset by RaTeX at exactly the version merman
# links (its `math` feature), so the build holds one copy; they are updated
# together with merman. The KaTeX fonts (OFL-1.1) are embedded.
ratex-parser = "=0.1.15"
ratex-layout = "=0.1.15"
ratex-types = "=0.1.15"
ratex-svg = { version = "=0.1.15", features = ["embed-fonts"] }
# PDF export (ADR-015): Typst set as a library, its fonts and the system's.
typst = "=0.15.1"
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"
typst-kit = { version = "=0.15.1", default-features = false, features = ["embedded-fonts", "scan-fonts"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ureq = "3"
scraper = { version = "0.29", default-features = false }

[dev-dependencies]
# OQ-222: every AsciiMath spelling the parser knows is tested to typeset.
asciimath-parser = "=0.7.0"
