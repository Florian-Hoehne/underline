[package]
name = "underline-markup"
description = "Note formats and the facade parser of Underline: blocks, sections, and formatting of Markdown and AsciiDoc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Nothing here touches files, threads, clocks, or the network: this crate builds
# for wasm32-unknown-unknown too (ADR-025, docs/migration/plan.md section 17).
[dependencies]
serde.workspace = true
comrak.workspace = true
regex.workspace = true
regex-syntax.workspace = true
unicode-segmentation.workspace = true
# UC-024 BR-001, A5: whether a front matter is YAML GitHub reads (ADR-004's
# YAML crate; builds for wasm32-unknown-unknown).
serde_norway.workspace = true
thiserror.workspace = true
# FR-098, OQ-222 (ADR-029): AsciiMath read by its own parser (MIT, pure Rust,
# builds for wasm32-unknown-unknown) and written as LaTeX in `asciimath.rs`.
# Pinned exactly: it is young (0.x) and its tree is matched field by field.
asciimath-parser = "=0.7.0"
