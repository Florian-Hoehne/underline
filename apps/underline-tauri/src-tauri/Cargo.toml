[package]
name = "underline-tauri"
description = "Underline desktop app on Tauri 2 (migration from the egui app)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "underline-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
underline-core.workspace = true
underline-mcp.workspace = true
underline-session = { workspace = true, features = ["specta"] }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = ["specta"] }
parking_lot = "0.12"
# Typed bindings for the window (plan section 4). Release candidates: pinned
# exactly, as tauri-specta asks.
specta.workspace = true
specta-typescript = "=0.0.13"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }

[dev-dependencies]
tauri = { version = "2.12", features = ["specta", "test"] }
